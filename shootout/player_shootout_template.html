<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex,follow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{PLAYER_NAME}} - Shootout Videos | Deep Hockey</title>
    <meta name="description" content="Complete shootout analysis for {{PLAYER_NAME}} including video breakdowns of all shootout attempts.">
    <meta name="keywords" content="{{PLAYER_NAME}}, shootout, NHL, {{TEAM_NAME}}, hockey analysis">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="../../css/shootout.css">
    <link rel="stylesheet" href="/css/shootout-context.css">
    <link rel="stylesheet" href="/css/shootout-player.css">
</head>
<body>
    <!-- App Container -->
    <div id="app" class="app-container">

        <!-- Header -->
        <header id="main-header" class="site-header"></header>

        <!-- Main Content -->
        <main class="main-shootout-content">
            
            <!-- Player Header -->
            <div class="player-header">
                <h1 class="player-name">{{PLAYER_NAME}} Shootout Videos</h1>
            </div>

            <!-- Shootout Container -->
            <div class="shootout-container">
                
                <!-- Left Column (Video and Stats on wide screens) -->
                <div class="left-column">
                    <!-- Video Player -->
                    <div class="video-player-container">
                        <video id="shootout-video" class="video-player" controls playsinline>
                            <source src="{{FIRST_VIDEO_URL}}" type="video/mp4">
                            Your browser does not support the video tag.
                        </video>
                        <div id="no-video-message" class="no-video-message" style="display: none;">
                            <div class="no-video-icon">🎥</div>
                            <h3>No Video Available</h3>
                            <p>Unfortunately, there is no video available for this shootout attempt.</p>
                        </div>
                        <div class="video-navigation" aria-label="Video navigation">
                            <button type="button" class="video-nav-button" id="previous-video" aria-label="Previous video" disabled>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
                            </button>
                            <div class="video-info">
                                <div class="video-title" id="video-title">{{FIRST_VIDEO_TITLE}}</div>
                                <div class="video-details" id="video-details">{{FIRST_VIDEO_DETAILS}}</div>
                            </div>
                            <button type="button" class="video-nav-button" id="next-video" aria-label="Next video" disabled>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
                            </button>
                        </div>
                        <div class="video-controls">
                            <button type="button" class="browse-videos" id="browse-videos" aria-haspopup="dialog" aria-expanded="false" aria-controls="video-picker" disabled>
                                <span>Browse videos</span><span class="video-position" id="video-position"></span>
                            </button>
                            <div class="autoplay-control">
                                <label class="toggle-switch">
                                    <input type="checkbox" id="autoplay-toggle" aria-label="Autoplay next video" checked>
                                    <span class="toggle-slider"></span>
                                    <span class="toggle-label">Autoplay</span>
                                </label>
                            </div>
                        </div>
                        <p class="video-status" id="video-status" aria-live="polite" aria-atomic="true"></p>
                    </div>

                    <!-- Player Stats (desktop: below video) -->
                    <div class="player-stats-desktop">
                        {{PLAYER_STATS}}
                    </div>
                </div>

                <!-- Right Column (Attempts Sidebar) -->
                <div class="right-column">
                    <!-- Attempts Sidebar -->
                    <div class="attempts-sidebar">
                        <h3 class="sidebar-title">Shootout Attempts</h3>
                        {{ATTEMPT_ITEMS}}
                    </div>

                    <!-- Player Stats (mobile: below sidebar) -->
                    <div class="player-stats-mobile">
                        {{PLAYER_STATS}}
                    </div>
                </div>

            </div>

            <!-- Back to Articles -->
            <div style="text-align: center; margin-top: 3rem;">
                <a href="../../index.html" class="card-link">← Back to Deep Hockey</a>
            </div>

        </main>
        
        <!-- Footer -->
        <footer id="main-footer" class="site-footer"></footer>

    </div>

    <dialog class="video-picker" id="video-picker" aria-labelledby="video-picker-title">
        <div class="video-picker-heading">
            <h2 id="video-picker-title">{{PLAYER_NAME}} videos</h2>
            <button type="button" class="video-picker-close" aria-label="Close video picker" autofocus>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
            </button>
        </div>
        <div class="video-picker-filters" role="group" aria-label="Filter videos">
            <button type="button" data-video-filter="all" aria-pressed="true">All videos</button>
            <button type="button" data-video-filter="goal" aria-pressed="false">Goals</button>
        </div>
        <p class="video-picker-empty" id="video-picker-empty" role="status" hidden></p>
        <div class="video-picker-list" id="video-picker-list" aria-label="Available videos"></div>
    </dialog>
    <script src="../../js/main.js"></script>
    <script src="/js/shootout-player.js" defer></script>
</body>
</html>
